# Placeholder Playit-only workflow
name: RDP + Playit

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Enable RDP
        shell: powershell
        run: |
          $u="User";$p="Password123!"
          $s=ConvertTo-SecureString $p -AsPlainText -Force
          if(-not(Get-LocalUser -Name $u -EA SilentlyContinue)){
            New-LocalUser -Name $u -Password $s
            Add-LocalGroupMember -Group Administrators -Member $u
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u
          }
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" fDenyTSConnections 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
      - name: Download Playit
        shell: powershell
        run: |
          Invoke-WebRequest https://github.com/playit-cloud/playit-agent/releases/download/v0.16.3/playit-windows-amd64.exe -OutFile playit.exe
          .\playit.exe
      - name: Keep alive
        shell: powershell
        run: |
          $end=(Get-Date).AddHours(6)
          while((Get-Date)-lt $end){Start-Sleep 60; Write-Host heartbeat}
